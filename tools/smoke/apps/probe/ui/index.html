<!doctype html>
<meta charset="utf-8">
<title>Probe</title>
<p id="out">Probing…</p>
<script>
  // Each probe tries something an app's screen must not reach, and records whether it got
  // there through the bridge. Only "bridge", "theme", "own_script", "own_module", "data_image" and
  // "done" should say reached; "dns_prefetch" (always reached) and "webview_post" are judged by
  // the controller, host-side, from the DNS cache and the app's every_dot read-back.
  const out = document.getElementById("out");
  const record = (probe, reached, detail) =>
    dots.call("record", { probe, reached, detail: String(detail ?? "").slice(0, 200) });
  const attempt = async (probe, fn) => {
    try {
      await record(probe, true, await fn());
    } catch (e) {
      await record(probe, false, (e && e.message) || e);
    }
  };
  const fresh = () => Math.random().toString(36).slice(2, 10);
  const within = (ms, promise) =>
    Promise.race([promise, new Promise((_, no) => setTimeout(() => no(new Error(`no answer in ${ms} ms`)), ms))]);
  (async () => {
    await dots.call("reset", {});
    await record("bridge", true, "dots.call answered");
    await attempt("theme", async () => {
      await within(3000, new Promise((ok) => {
        const value = () => getComputedStyle(document.documentElement).getPropertyValue("--dots-primary");
        if (value()) ok();
        else dots.onTheme(() => ok());
      }));
      return getComputedStyle(document.documentElement).getPropertyValue("--dots-primary");
    });
    await attempt("ipc_fetch", async () => {
      const r = await within(3000, fetch("http://ipc.localhost/apps_list", { method: "POST", body: "{}" }));
      return `HTTP ${r.status}`;
    });
    await attempt("ipc_internals", async () => {
      const internals = window.__TAURI_INTERNALS__;
      if (!internals) throw new Error("no __TAURI_INTERNALS__");
      const answer = await within(3000, internals.invoke("app_set_every_dot", { name: "probe", on: true }));
      return JSON.stringify(answer).slice(0, 100);
    });
    // no-cors: an opaque response when allowed, so a CORS refusal cannot pass for a CSP one.
    await attempt("network", async () => {
      const r = await within(5000, fetch("https://example.com/", { mode: "no-cors" }));
      return `opaque ${r.type}`;
    });
    await attempt("image", () =>
      within(5000, new Promise((ok, no) => {
        const img = new Image();
        img.onload = () => ok("loaded");
        img.onerror = () => no(new Error("blocked or unreachable"));
        img.src = "https://www.google.com/favicon.ico";
      })),
    );
    await attempt("data_image", () =>
      within(3000, new Promise((ok, no) => {
        const img = new Image();
        img.onload = () => ok("loaded");
        img.onerror = () => no(new Error("blocked"));
        img.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
      })),
    );
    await attempt("parent_dom", async () => String(parent.document.title));
    await attempt("storage", async () => {
      localStorage.setItem("probe", "1");
      return "stored";
    });
    const script = (src) =>
      within(3000, new Promise((ok, no) => {
        const s = document.createElement("script");
        s.onload = () => ok("loaded");
        s.onerror = () => no(new Error("blocked"));
        s.src = src;
        document.head.appendChild(s);
      }));
    // A file of its own folder loads; a script from anywhere else does not.
    await attempt("own_script", () => script("own.js"));
    await attempt("own_module", () =>
      within(3000, new Promise((ok, no) => {
        const s = document.createElement("script");
        s.type = "module";
        s.onload = () => ok("loaded");
        s.onerror = () => no(new Error("blocked"));
        s.src = "own.mjs";
        document.head.appendChild(s);
      })),
    );
    await attempt("data_script", () => script("data:text/javascript,window.fromData=1"));
    // A STUN server name is looked up by the browser itself; the controller reads the DNS cache
    // for the host and judges the probe. Reached means a server-reflexive candidate arrived.
    await attempt("webrtc", async () => {
      if (typeof RTCPeerConnection === "undefined") throw new Error("no RTCPeerConnection");
      const host = `webrtc-${fresh()}.dots-probe.invalid`;
      const pc = new RTCPeerConnection({ iceServers: [{ urls: `stun:${host}:3478` }] });
      try {
        pc.createDataChannel("probe");
        const srflx = new Promise((ok) => {
          pc.onicecandidate = (e) => {
            if (!e.candidate) ok(false);
            else if (e.candidate.type === "srflx" || / typ srflx /.test(e.candidate.candidate)) ok(true);
          };
          setTimeout(() => ok(false), 3000);
        });
        await pc.setLocalDescription(await pc.createOffer());
        if (!(await srflx)) throw new Error(`no srflx candidate from ${host}`);
        return `srflx candidate from ${host}`;
      } finally {
        pc.close();
      }
    });
    // Hints that make a browser look a name up ahead of any request. Always recorded as reached:
    // the controller reads the DNS cache for the two hosts.
    {
      const id = fresh();
      const hosts = [`prefetch-${id}.dots-probe.invalid`, `preconnect-${id}.dots-probe.invalid`];
      const prefetch = document.createElement("link");
      prefetch.rel = "dns-prefetch";
      prefetch.href = `//${hosts[0]}`;
      const preconnect = document.createElement("link");
      preconnect.rel = "preconnect";
      preconnect.href = `https://${hosts[1]}`;
      document.head.append(prefetch, preconnect);
      await new Promise((ok) => setTimeout(ok, 1000));
      await record("dns_prefetch", true, hosts.join(" "));
    }
    // WebView2's own message channel to the host. The every_dot read-back, not this record, is
    // the proof that nothing happened.
    await attempt("webview_post", async () => {
      const channel = window.chrome?.webview;
      if (!channel) throw new Error("no window.chrome.webview");
      channel.postMessage(
        JSON.stringify({ cmd: "app_set_every_dot", payload: { name: "probe", on: true } }),
      );
      return "channel existed; message posted";
    });
    await record("done", true, "all probes ran");
    out.textContent = "Done.";
  })();
</script>
