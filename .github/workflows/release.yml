# Builds, signs and publishes a release when a version tag is pushed (updates spec §4). The
# tag must be v<version> and agree with every version field (tools/release/release.mjs). A
# tag with a suffix, such as v0.2.0-rc.1, is published as a prerelease, which no installed
# Dots takes on its own; any other tag must be on master. The person steps are in
# docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Nothing is built from code whose tests fail (updates UI spec section 5.4).
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install the UI's packages
        run: bun install --frozen-lockfile

      - name: Check the formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # preview_schedule_lists_the_next_fire_times depends on the machine's time zone.
      - name: Run the core tests
        run: cargo test -p dots-core --locked -- --skip preview_schedule_lists_the_next_fire_times

      - name: Run the app tests
        run: cargo test -p dots-app --locked

      - name: Run the release script's tests
        run: node --test tools/release/release.test.mjs

      - name: Check and test the UI
        working-directory: ui
        run: |
          bun run typecheck
          bun run test

  release:
    needs: test
    runs-on: windows-latest
    steps:
      # The whole history, so that a release tag can be checked against master.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check the tag against the version fields
        id: version
        shell: bash
        run: |
          node --test tools/release/release.test.mjs
          node tools/release/release.mjs check "$GITHUB_REF_NAME"

      # Fails unless the check said "true" or "false", so a check that printed nothing cannot
      # pass for a release. A release tag must be on master; a prerelease may sit anywhere.
      - name: Check that a release tag is on master
        shell: bash
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          case "$PRERELEASE" in
            true) echo "release: $GITHUB_REF_NAME is a prerelease" ;;
            false)
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
                echo "release: $GITHUB_REF_NAME is not on master; tag a commit of origin/master"
                exit 1
              fi
              ;;
            *)
              echo "release: the check gave prerelease='$PRERELEASE', not true or false"
              exit 1
              ;;
          esac

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install the UI's packages
        run: bun install --frozen-lockfile

      # No signing key here: the build runs the project's own scripts and packages, which have
      # no need of it. `tauri.conf.json` leaves the updater files off; the next step signs.
      - name: Build the installer
        shell: bash
        run: bun run tauri build -- --locked

      # The only step that sees the key. The updater installs the NSIS installer itself, so
      # its signature is the one the release carries.
      - name: Sign the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          installer="target/release/bundle/nsis/Dots_${version}_x64-setup.exe"
          bun run tauri signer sign --app-version "$version" "$installer"
          test -s "$installer.sig"

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          installer="target/release/bundle/nsis/Dots_${version}_x64-setup.exe"
          # The notes the Releases page wrote for this version, when the tag has them; else
          # GitHub's own. Notes left on master by an earlier version are never used.
          node tools/release/release.mjs notes "$GITHUB_REF_NAME" release-notes.md release-notes.out.md
          node tools/release/release.mjs manifest "$GITHUB_REF_NAME" "$installer" latest.json release-notes.out.md
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if [ -s release-notes.out.md ]; then
            flags+=(--notes-file release-notes.out.md)
          else
            flags+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" --title "Dots $version" \
            "${flags[@]}" "$installer" "$installer.sig" latest.json
