# Checks that Dots builds and its tests pass on macOS, without making a release
# (docs/superpowers/specs/2026-11-06-mac-build-design.md). Run it by hand from the Actions
# tab, or let a pull request that changes the Rust code or this file run it.
name: Mac check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/mac-check.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "apps/dots-app/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install the UI's packages
        run: bun install --frozen-lockfile

      # The app embeds the built UI, so it is built before the app is compiled.
      - name: Build the UI
        run: bun run --cwd ui build

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # preview_schedule_lists_the_next_fire_times depends on the machine's time zone.
      - name: Run the core tests
        run: cargo test -p dots-core --locked -- --skip preview_schedule_lists_the_next_fire_times

      - name: Run the app tests
        run: cargo test -p dots-app --locked
