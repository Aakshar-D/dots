[package]
name = "dots-core"
version = "0.2.0-rc.3"
edition = "2021"

[features]
# Helpers for tests only (`TestProtector`, which hides nothing). Enabled for dots-core's own tests
# through its dev-dependency on itself; no build that ships has it.
test-support = []

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
age = { version = "0.12.1", features = ["armor"] }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
crypto_box = { version = "0.9", features = ["seal"] }
chrono = { version = "0.4", features = ["serde"] }
cron = "0.15"
getrandom = "0.3"
globset = "0.4"
notify = "8"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
mail-parser = "0.11"
futures-util = "0.3"
ignore = "0.4"
minisign = "0.10"
minisign-verify = "0.3"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest"] }
regex = "1"
# TLS trusts the public roots and this machine's own (the Windows certificate store), so a
# service behind a company CA connects.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-webpki-roots",
    "rustls-tls-native-roots",
] }
rquickjs = { version = "0.14", default-features = false }
rusqlite = { version = "0.32", features = ["hooks", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
ulid = "1"
zeroize = { version = "1", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
dots-core = { path = ".", features = ["test-support"] }
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = "0.29"
tracing-subscriber = "0.3"
wiremock = "0.6"
